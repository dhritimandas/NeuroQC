[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroqc"
version = "0.1.0"
description = "Multimodal-LLM-based neuroimaging quality control: pipeline for evaluating whether VLMs can predict downstream pipeline failure on brain MRI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Dhritiman Das" },
]
keywords = [
    "neuroimaging",
    "quality-control",
    "vision-language-models",
    "MRI",
    "SynthSeg",
    "FastMRI",
    "ABIDE",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Pin core scientific stack to the versions verified to work with this
# pipeline (April 2026). For the heavy ML stack (torch / transformers / peft)
# we declare the *minor* version we tested with; users on newer minors
# generally work but bf16 + bitsandbytes determinism is best-effort.
dependencies = [
    # CLI + reporting
    "typer>=0.24,<1.0",
    "rich>=14.0",
    "tqdm>=4.66",

    # Tabular + numeric
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",

    # Plotting
    "matplotlib>=3.9",
    "seaborn>=0.13",

    # Neuroimaging I/O + transforms
    "nibabel>=5.2",
    "monai>=1.4",
    "torchio>=0.20",

    # ML stack (verified versions; bf16/bnb determinism is best-effort across hardware)
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
    "peft>=0.13",
    "bitsandbytes>=0.43; platform_system != 'Darwin'",
    "accelerate>=1.0",

    # External baselines + APIs
    "mriqc-learn>=0.0.3",
    "openai>=1.40",

    # Stats not in scipy / sklearn
    "krippendorff>=0.7",

    # Cloud
    "boto3>=1.34",
    "botocore>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "black>=24.0",
]

[project.urls]
Homepage = "https://github.com/dhritimandas/NeuroQC"
Repository = "https://github.com/dhritimandas/NeuroQC"

[tool.setuptools]
# This project uses the ``code/`` and ``tests/`` layout (digit-prefixed scripts);
# we don't ship a Python package — the codebase is run as scripts via the CLI
# entry points described in README.md. Telling setuptools to skip auto-discovery
# avoids "Multiple top-level packages" errors.
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by black + 88-col not strict for research code

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
